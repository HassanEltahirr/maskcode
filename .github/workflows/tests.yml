name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MaskCode
        run: python -m pip install .
      - name: Run tests without provider accounts or model downloads
        run: python -m unittest discover -s tests -q
      - name: Check CLI
        run: maskcode --version
      - name: Offline scan of the repository examples
        run: maskcode gateway scan examples
