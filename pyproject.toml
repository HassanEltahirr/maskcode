[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maskcode"
version = "1.0.0"
description = "Hide names, emails, keys and private words before you paste into any AI assistant, then restore the reply. Runs locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LEGAL_REVIEW.md"]
keywords = ["privacy", "pii", "redaction", "ai", "chatgpt", "claude", "masking", "data-protection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = ["prompt_toolkit==3.0.52", "wcwidth==0.7.0"]

[project.urls]
Repository = "https://github.com/HassanEltahirr/maskcode"
Issues = "https://github.com/HassanEltahirr/maskcode/issues"

[project.scripts]
maskcode = "privacy_gateway.cli:main"
veil = "privacy_gateway.cli:main"

[project.gui-scripts]
maskcode-app = "privacy_gateway.app:main"

[tool.setuptools.package-data]
privacy_gateway = ["console.html", "app.html"]

[tool.setuptools.packages.find]
include = ["privacy_gateway*"]
